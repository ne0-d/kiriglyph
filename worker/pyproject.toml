[project]
name = "kiriglyph-worker"
version = "0.0.0"
description = "Long-lived NDJSON OCR worker for Kiriglyph V0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-fast>=2.44",
    "onnxruntime==1.31.0",
    "pillow==12.3.0",
    "rapidocr==3.10.0",
]

[project.scripts]
kiriglyph-worker = "worker.__main__:main"
kiriglyph-capture = "worker.portal_capture:main"
kiriglyph-fetch-models = "worker.segmentation_models:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
