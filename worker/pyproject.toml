[project]
name = "live-text-worker"
version = "0.0.0"
description = "Long-lived NDJSON OCR worker for Ubuntu Live Text V0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime==1.31.0",
    "pillow==12.3.0",
    "rapidocr==3.10.0",
]

[project.scripts]
live-text-worker = "worker.__main__:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
