name: Bug report
description: Something does not work the way you expect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Kiriglyph is a beta built for Ubuntu with GNOME on Wayland.
        Please do not attach screenshots that show private content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help most. Say whether it happens every time.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiriglyph version
      description: Run `kiriglyph --version`.
      placeholder: Kiriglyph 0.1.0+1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Ubuntu and GNOME version
      description: Run `lsb_release -d` and `gnome-shell --version`.
      placeholder: Ubuntu 26.04 LTS, GNOME Shell 50
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: Run `echo $XDG_SESSION_TYPE`.
      options:
        - Wayland
        - X11 (not supported, but tell us what you see)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - The .deb from a release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Number of displays and scaling, terminal output from running `kiriglyph`, or what you already tried.
